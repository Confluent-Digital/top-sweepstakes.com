; Les visuels de dotation depassent regulierement 2 Mo, la valeur par defaut.
; post_max_size doit rester superieur a upload_max_filesize, sinon PHP rejette
; la requete entiere avant meme d'avoir vu le fichier — et le formulaire revient
; vide sans message.
upload_max_filesize = 10M
post_max_size = 12M
max_file_uploads = 5
