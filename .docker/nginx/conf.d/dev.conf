server {
    listen 80;
    server_name top-sweepstakes.local top-sweepstakes.com www.top-sweepstakes.com;

    set $root /data/www/top-sweepstakes.com/public;
    root $root;
    index index.php;

    client_max_body_size 12m;

    # Rien de ce qui vit hors de public/ ne doit fuir.
    location ^~ /.git    { return 404; }
    location ^~ /.docker { return 404; }
    location ^~ /.env    { return 404; }
    location ^~ /.claude { return 404; }

    access_log /var/log/nginx/topsweepstakes_access.log;
    error_log  /var/log/nginx/topsweepstakes_error.log warn;

    # Visuels de concours et d'offres : uploades depuis le BO, servis tels quels.
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|webp|avif|map)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass topsweepstakes_php:9000;
        fastcgi_index index.php;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 120s;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS off;
    }
}
