services:
  topsweepstakes_nginx:
    image: docker-registry.confluent-digital.com/nginx:1.28-alpine
    container_name: topsweepstakes_nginx
    volumes:
      - ".:/data/www/top-sweepstakes.com"
      - "./.docker/nginx/conf.d:/etc/nginx/conf.d"
    ports:
      - "127.0.0.1:${DOCKER_NGINX_PORT}:80"
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV}
    depends_on:
      - topsweepstakes_php
    networks:
      - topsweepstakes-network
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "1"

  topsweepstakes_php:
    build: "./.docker/php-fpm"
    container_name: topsweepstakes_php
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /data/www/top-sweepstakes.com
    volumes:
      - ".:/data/www/top-sweepstakes.com"
    expose:
      - "9000"
    ports:
      - "127.0.0.1:${DOCKER_PHP_PORT}:9000"
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV}
      TZ: ${TZ}
      COMPOSER_HOME: /data/www/top-sweepstakes.com/cache/composer
    depends_on:
      - topsweepstakes_mariadb
    networks:
      - topsweepstakes-network
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "1"

  topsweepstakes_mariadb:
    image: mariadb:11
    container_name: topsweepstakes_mariadb
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_allowed_packet=32505856
      - --innodb-buffer-pool-size=512M
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: ${TZ}
    volumes:
      - "${DOCKER_DB_DIRECTORY}:/var/lib/mysql"
    expose:
      - "3306"
    # Expose sur la loopback seulement : SQLyog s'y branche par tunnel SSH.
    ports:
      - "127.0.0.1:${DOCKER_MYSQL_PORT}:3306"
    restart: unless-stopped
    networks:
      - topsweepstakes-network
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "1"

networks:
  topsweepstakes-network:
    driver: bridge
